<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCluster Console</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --card2:#1c2536; --line:#2a3550;
          --txt:#e8edf7; --dim:#93a1bd; --acc:#5b9dff; --ok:#3fce7a;
          --warn:#f5b83d; --bad:#f26d6d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:"Loma","Garuda",system-ui,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px;
           background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; } header .sub { color:var(--dim); font-size:12px; }
  .chip { background:var(--card2); border:1px solid var(--line);
          border-radius:20px; padding:4px 12px; font-size:12px; color:var(--dim); }
  .chip b { color:var(--txt); }
  main { display:grid; grid-template-columns:380px 1fr; gap:16px;
         padding:16px 22px; max-width:1400px; margin:0 auto; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line);
           border-radius:12px; padding:14px; margin-bottom:16px; }
  .panel h2 { font-size:13px; color:var(--dim); text-transform:uppercase;
              letter-spacing:.08em; margin-bottom:10px; }
  .node { background:var(--card2); border:1px solid var(--line);
          border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .node .row1 { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); } .dot.mid { background:var(--warn); }
  .node b { font-size:14px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:12px;
           border:1px solid var(--line); color:var(--dim); margin-left:auto; }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.bad { color:var(--bad); border-color:var(--bad); }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px;
        font-size:12px; color:var(--dim); }
  .kv b { color:var(--txt); font-weight:normal; }
  select, button, input { font-family:inherit; }
  select { width:100%; background:var(--card2); color:var(--txt);
           border:1px solid var(--line); border-radius:8px;
           padding:8px; font-size:13px; }
  button { background:var(--acc); color:#08101f; border:0; border-radius:8px;
           padding:9px 16px; font-size:13px; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:var(--card2); color:var(--txt); border:1px solid var(--line); }
  #feed { font-size:12px; color:var(--dim); max-height:220px; overflow-y:auto; }
  #feed div { padding:3px 0; border-bottom:1px dashed var(--line); }
  #feed span { color:var(--acc); margin-right:6px; }
  /* chat */
  #chatpanel { display:flex; flex-direction:column; height:calc(100vh - 90px); }
  #msgs { flex:1; overflow-y:auto; padding:6px 4px; }
  .msg { max-width:80%; margin:8px 0; padding:10px 14px; border-radius:12px;
         font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--acc); color:#08101f; margin-left:auto; border-bottom-right-radius:3px; }
  .bot { background:var(--card2); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .meta { display:block; margin-top:6px; font-size:11px; color:var(--dim); }
  .meta b { color:var(--acc); }
  .params { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .params label { font-size:11px; color:var(--dim); display:flex;
                  flex-direction:column; gap:3px; }
  .params input { width:70px; background:var(--card2); color:var(--txt);
                  border:1px solid var(--line); border-radius:6px;
                  padding:6px; font-size:12px; }
  .inputrow { display:flex; gap:8px; }
  #prompt { flex:1; background:var(--card2); color:var(--txt);
            border:1px solid var(--line); border-radius:10px;
            padding:12px; font-size:14px; resize:none; height:52px; }
  .thinking { color:var(--dim); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>🍓 PiCluster Console</h1>
  <span class="sub">master @ rpi4b-1</span>
  <span class="chip" id="chip-online">workers: <b>-</b></span>
  <span class="chip" id="chip-pending">pending: <b>-</b></span>
  <span class="chip" id="chip-model">model: <b>-</b></span>
</header>
<main>
  <div>
    <div class="panel">
      <h2>สถานะโหนด</h2>
      <div id="nodes">กำลังโหลด...</div>
    </div>
    <div class="panel">
      <h2>โมเดลของคลัสเตอร์ (ต้องมีทั้งสองเครื่อง)</h2>
      <select id="modelSel"></select>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center;">
        <button id="applyBtn">สลับโมเดล</button>
        <span id="modelMsg" style="font-size:12px;color:var(--dim);"></span>
      </div>
    </div>
    <div class="panel">
      <h2>กิจกรรมคลัสเตอร์</h2>
      <div id="feed"></div>
    </div>
  </div>
  <div class="panel" id="chatpanel">
    <h2>แชทผ่านคลัสเตอร์ — ทุกคำตอบบอกว่า Pi ตัวไหนประมวลผล</h2>
    <div class="params">
      <label>max_tokens <input id="p-tok" type="number" value="128" min="1" max="512"></label>
      <label>temperature <input id="p-temp" type="number" step="0.1" value="0.7" min="0" max="2"></label>
      <label>seed (เว้นว่าง = สุ่ม) <input id="p-seed" type="number" placeholder="สุ่ม"></label>
    </div>
    <div id="msgs"></div>
    <div class="inputrow">
      <textarea id="prompt" placeholder="พิมพ์คำถาม... (Enter ส่ง, Shift+Enter ขึ้นบรรทัด)"></textarea>
      <button id="sendBtn">ส่ง</button>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let busy = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

function nodeCard(w) {
  const online = w.alive;
  const dot = online ? (w.llama_ok ? "on" : "mid") : "";
  const llama = online
    ? (w.llama_ok ? '<span class="badge ok">llama OK</span>'
                  : '<span class="badge bad">llama DOWN</span>')
    : '<span class="badge bad">offline</span>';
  const up = w.uptime_s ? fmtUp(w.uptime_s) : "-";
  const mem = w.mem_avail_mb != null && w.mem_mb
    ? `${w.mem_avail_mb} / ${w.mem_mb} MB ว่าง` : "-";
  const busy = w.free ? "ว่าง" : (w.inflight != null ? `ทำ job ${w.inflight}` : "busy");
  return `<div class="node">
    <div class="row1"><span class="dot ${dot}"></span><b>${w.name}</b>
      <span style="color:var(--dim);font-size:11px;">${w.addr}</span>${llama}</div>
    <div class="kv">
      <span>อุณหภูมิ <b>${w.temp_c != null ? w.temp_c + "°C" : "-"}</b></span>
      <span>RAM ว่าง <b>${mem}</b></span>
      <span>uptime <b>${up}</b></span>
      <span>สถานะ <b>${busy}</b></span>
      <span>โมเดลปัจจุบัน <b>${w.current_model || "-"}</b></span>
      <span>โมเดลในเครื่อง <b>${(w.models || []).length} ไฟล์</b></span>
    </div></div>`;
}

function fmtUp(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60);
  return (d ? d + " วัน " : "") + h + " ชม. " + m + " นาที";
}

async function refresh() {
  try {
    const s = await api("/api/status");
    const ws = s.workers || [];
    const alive = ws.filter(w => w.alive).length;
    $("chip-online").innerHTML = `workers: <b>${alive}/${ws.length}</b>`;
    $("chip-pending").innerHTML = `pending: <b>${s.pending}</b>`;
    const models = ws.filter(w => w.alive).map(w => w.current_model);
    $("chip-model").innerHTML =
      `model: <b>${[...new Set(models)].join(", ") || "-"}</b>`;
    $("nodes").innerHTML = ws.map(nodeCard).join("") ||
      '<span style="color:var(--dim)">ยังไม่มี worker ลงทะเบียน</span>';
    $("feed").innerHTML = (s.events || []).slice().reverse()
      .map(e => `<div><span>${e.t}</span>${e.text}</div>`).join("")
      || '<div>ยังไม่มีกิจกรรม</div>';
    const common = ws.filter(w => w.alive && w.models)
      .map(w => new Set(w.models));
    const sel = $("modelSel");
    if (common.length) {
      const inter = [...common.reduce((a, b) =>
        new Set([...a].filter(x => b.has(x))))].sort();
      const cur = sel.value;
      sel.innerHTML = inter.length
        ? inter.map(m => `<option>${m}</option>`).join("")
        : '<option value="">ไม่มีโมเดลที่มีทั้งสองเครื่อง</option>';
      if (inter.includes(cur)) sel.value = cur;
    } else sel.innerHTML = '<option value="">-</option>';
  } catch (e) {
    $("nodes").innerHTML = `<span style="color:var(--bad)">เชื่อมต่อ master ไม่ได้: ${e.message}</span>`;
  }
}

function addMsg(cls, text, meta) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  if (meta) {
    const m = document.createElement("span");
    m.className = "meta";
    m.innerHTML = meta;
    div.appendChild(m);
  }
  $("msgs").appendChild(div);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return div;
}

async function send() {
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) return;
  busy = true; $("sendBtn").disabled = true;
  $("prompt").value = "";
  addMsg("user", text);
  const thinking = addMsg("bot thinking", "กำลังประมวลผลผ่านคลัสเตอร์...");
  try {
    const r = await api("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        prompt: text,
        max_tokens: +$("p-tok").value || 128,
        temperature: +$("p-temp").value || 0,
        seed: $("p-seed").value === "" ? Math.floor(Math.random() * 1e9)
                                       : +$("p-seed").value
      })
    });
    thinking.remove();
    if (r.status === "ok") {
      addMsg("bot", r.output_text || "(ว่างเปล่า)",
        `ประมวลผลโดย <b>${r.worker}</b> · ${(r.predicted_per_second || 0).toFixed(1)} tok/s · ${(r.wall_ms / 1000).toFixed(1)} s`);
    } else {
      addMsg("bot", "⚠ ผิดพลาด: " + (r.error || "unknown"));
    }
  } catch (e) {
    thinking.remove();
    addMsg("bot", "⚠ เชื่อมต่อไม่ได้: " + e.message);
  }
  busy = false; $("sendBtn").disabled = false;
  refresh();
}

$("sendBtn").onclick = send;
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("applyBtn").onclick = async () => {
  const m = $("modelSel").value;
  if (!m) return;
  $("applyBtn").disabled = true;
  $("modelMsg").textContent = "กำลังสั่งทุก node โหลดโมเดล... (ใช้เวลา ~1 นาที)";
  try {
    const r = await api("/api/model", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({model: m})
    });
    $("modelMsg").textContent = "ส่งคำสั่งไปที่: " + (r.sent || []).join(", ")
      + " — รอสักครู่แล้วดูสถานะโหนด";
  } catch (e) {
    $("modelMsg").textContent = "ผิดพลาด: " + e.message;
  }
  $("applyBtn").disabled = false;
  setTimeout(refresh, 3000);
};
refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
